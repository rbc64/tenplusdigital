# Builds and publishes tenplusdigital.com.
# Every push: new images in portfolio/uploads/ are converted and added to the
# portfolio (newest first), then the whole site is deployed to GitHub Pages.
name: Build & publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process new portfolio uploads
        run: |
          pip install --quiet pillow
          python tools/process_uploads.py

      - name: Save processed images
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Portfolio: add new thumbnails"
            git push
          else
            echo "Nothing new to save."
          fi

      - name: Prepare site files
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' \
                --exclude 'portfolio/uploads' --exclude 'README.md' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
